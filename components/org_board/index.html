<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --panel: transparent;
      --line: #d7e3ef;
      --head: #f6f8fb;
      --dept: #fff6d4;
      --cell: #e8f2fb;
      --ink: #243044;
      --dept-w: 48px;
      --gap: 8px;
      --class-w: 196px;
    }
    * { box-sizing: border-box; }
    html, body, .panel, .board-scroll {
      background: transparent;
    }
    html, body {
      margin: 0;
      color: var(--ink);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }
    .panel { padding: 4px 4px 0; }
    .board-scroll {
      overflow-x: auto;
      overflow-y: hidden;
      padding: 2px 2px 8px;
      scrollbar-color: #c9d4e0 transparent;
    }
    .board-scroll::-webkit-scrollbar { height: 8px; }
    .board-scroll::-webkit-scrollbar-thumb {
      background: #c9d4e0;
      border-radius: 99px;
    }
    .board {
      display: grid;
      grid-template-columns: var(--dept-w) var(--dept-w) repeat(var(--cols), minmax(var(--class-w), max-content));
      gap: var(--gap);
      width: max-content;
      min-width: 100%;
      user-select: none;
    }
    .head, .dept, .grade, .cell {
      border: 1px solid var(--line);
      color: var(--ink);
      border-radius: 12px;
      box-shadow: 0 1px 2px rgba(36, 64, 96, 0.05);
    }
    .head {
      background: var(--head);
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
    }
    .dept, .grade {
      background: var(--dept);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      border-color: #f0e2a4;
    }
    .cell {
      background: var(--cell);
      min-height: 58px;
      padding: 5px 6px 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      transition: background-color 0.16s ease, box-shadow 0.16s ease, transform 0.16s ease;
    }
    .teacher {
      width: 100%;
      font-size: 10px;
      font-weight: 600;
      line-height: 1.25;
      text-align: center;
      color: #5d7190;
      pointer-events: none;
      user-select: none;
    }
    .cell.selected {
      background: #dcedfb;
      border-color: #8eb4d8;
      box-shadow: 0 0 0 2px rgba(90, 146, 204, 0.28);
    }
    .cell.drop {
      background: #f7fbff;
      border-color: #7eace0;
      box-shadow: 0 0 0 2px rgba(70, 130, 210, 0.28);
    }
    .cell.no-teacher {
      background: #fdecec;
      border-color: #f3c9c9;
    }
    .cell.no-teacher.selected {
      background: #f8d6d6;
      border-color: #e7a8a8;
      box-shadow: 0 0 0 2px rgba(180, 35, 24, 0.2);
    }
    .cell.no-teacher.drop {
      background: #fff6f6;
      border-color: #e8b0b0;
      box-shadow: 0 0 0 2px rgba(180, 35, 24, 0.16);
    }
    .block-gap { height: 10px; }
    .names {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .name-row {
      display: flex;
      justify-content: center;
      gap: 6px;
      max-width: 100%;
    }
    .chip {
      appearance: none;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.35;
      padding: 1px 1px;
      white-space: nowrap;
      cursor: grab;
      border-radius: 4px;
      touch-action: none;
    }
    .chip.dup { color: #1565c0; }
    .chip:hover { background: rgba(255, 255, 255, 0.72); }
    .chip.dragging { opacity: 0.28; }
    body.is-dragging, body.is-dragging .chip { cursor: grabbing; }
    .ghost {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 30;
      pointer-events: none;
      padding: 3px 7px;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      border: 1px solid #c5d7ea;
      box-shadow: 0 8px 18px rgba(36, 64, 96, 0.16);
      font-size: 12.5px;
      font-weight: 700;
      white-space: nowrap;
    }
    .ghost.dup { color: #1565c0; }
    .footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding-top: 8px;
    }
    .hint, .status {
      margin: 0;
      font-size: 12px;
      line-height: 1.45;
      text-align: center;
    }
    .hint { color: #6b7c8f; }
    .status { min-height: 0; color: #3d6fbf; }
    .status:empty { display: none; }
    .actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .reset, .save {
      appearance: none;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      padding: 8px 28px;
      border-radius: 8px;
      cursor: pointer;
    }
    .reset {
      border: 1px solid #d5deea;
      background: #fff;
      color: #31445c;
    }
    .reset:hover { background: #f4f7fb; }
    .save {
      border: 0;
      background: #2563eb;
      color: #fff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
    }
    .save:hover { background: #1d4ed8; }
    .reset:disabled, .save:disabled { opacity: 0.55; cursor: progress; }
    #delpop {
      position: fixed;
      z-index: 40;
      transform: translate(-50%, 0);
      background: #fff;
      color: #b42318;
      border: 1px solid #b42318;
      border-radius: 8px;
      padding: 5px 12px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.28);
    }
    #delpop[hidden] { display: none !important; }
    #delpop:hover { background: #fff5f5; }
  </style>
</head>
<body>
  <div class="panel">
    <div class="board-scroll" id="scroller"></div>
    <div class="footer">
      <p class="hint">반을 선택한 뒤 이름을 끌어 다른 반으로 옮기거나, 이름을 두 번 눌러 삭제합니다. 저장 전까지는 화면에만 반영됩니다.</p>
      <div class="actions">
        <button class="reset" id="reset" type="button">초기화</button>
        <button class="save" id="save" type="button">저장</button>
      </div>
      <p class="status" id="status"></p>
    </div>
  </div>
  <button id="delpop" type="button" hidden>삭제</button>
  <script>
    const scroller = document.getElementById("scroller");
    const resetBtn = document.getElementById("reset");
    const saveBtn = document.getElementById("save");
    const statusEl = document.getElementById("status");
    const delpop = document.getElementById("delpop");

    let builtSig = "";
    let seenError = "";
    let specYear = 0;
    let state = new Map();
    let original = new Map();
    let selected = null;
    let drag = null;
    let lastX = 0;
    let lastY = 0;
    let scrollRaf = 0;
    let saveTimer = 0;
    let frameHeight = 0;

    function post(type, data) {
      window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
    }

    function fit() {
      const panel = document.querySelector(".panel");
      let height = panel ? panel.offsetHeight : 0;
      if (!delpop.hidden && panel) {
        const extra = delpop.getBoundingClientRect().bottom - panel.getBoundingClientRect().bottom;
        if (extra > 0) height += extra;
      }
      height = Math.ceil(height);
      if (height < 1 || Math.abs(height - frameHeight) < 2) return;
      frameHeight = height;
      post("streamlit:setFrameHeight", { height: height });
    }

    function hidePop() {
      delpop.hidden = true;
      delpop.dataset.id = "";
      frameHeight = 0;
      requestAnimationFrame(fit);
    }

    function showPop(x, y, id) {
      delpop.hidden = false;
      delpop.style.left = x + "px";
      delpop.style.top = (y + 10) + "px";
      delpop.dataset.id = id;
      frameHeight = 0;
      requestAnimationFrame(fit);
    }

    function selectCell(cell) {
      if (selected) selected.classList.remove("selected");
      selected = cell || null;
      if (selected) selected.classList.add("selected");
    }

    function cellKey(item) {
      return item.dept + "-" + item.grade + "-" + item.klass;
    }

    function changeSets() {
      const moves = [];
      const deletes = [];
      state.forEach(function (item, id) {
        if (item.deleted) {
          deletes.push(item.id);
          return;
        }
        if (original.get(id) !== cellKey(item)) {
          moves.push({
            id: item.id,
            dept: item.dept,
            grade: item.grade,
            klass: item.klass,
          });
        }
      });
      return { moves: moves, deletes: deletes };
    }

    function updateStatus() {
      if (saveBtn.disabled) return;
      const diff = changeSets();
      const count = diff.moves.length + diff.deletes.length;
      statusEl.textContent = count ? "저장 전 변경 " + count + "건" : "";
    }

    function makeChip(item) {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = item.dup ? "chip dup" : "chip";
      chip.textContent = item.label;
      chip.dataset.id = String(item.id);
      chip.dataset.key = "member-" + item.id;
      chip.addEventListener("pointerdown", onChipPointerDown);
      chip.addEventListener("dblclick", onChipDblClick);
      return chip;
    }

    function renderChips() {
      document.querySelectorAll(".cell .names").forEach(function (box) {
        box.replaceChildren();
      });
      const grouped = new Map();
      state.forEach(function (item) {
        if (item.deleted) return;
        const key = cellKey(item);
        if (!grouped.has(key)) grouped.set(key, []);
        grouped.get(key).push(item);
      });
      grouped.forEach(function (items, key) {
        const parts = key.split("-");
        const cell = document.querySelector(
          '.cell[data-dept="' + parts[0] + '"][data-grade="' + parts[1] + '"][data-klass="' + parts[2] + '"] .names'
        );
        if (!cell) return;
        items.sort(function (a, b) { return a.label.localeCompare(b.label, "ko"); });
        for (let index = 0; index < items.length; index += 3) {
          const row = document.createElement("div");
          row.className = "name-row";
          items.slice(index, index + 3).forEach(function (item) {
            row.appendChild(makeChip(item));
          });
          cell.appendChild(row);
        }
      });
      requestAnimationFrame(fit);
    }

    function place(el, column, row, rowSpan) {
      el.style.gridColumn = String(column);
      el.style.gridRow = rowSpan ? row + " / span " + rowSpan : String(row);
    }

    function mount(spec) {
      cleanupDrag();
      hidePop();
      resetBtn.disabled = false;
      saveBtn.disabled = false;
      window.clearTimeout(saveTimer);
      specYear = Number(spec.year) || 0;
      state = new Map();
      original = new Map();
      selected = null;
      (spec.members || []).forEach(function (member) {
        const id = String(member.id);
        state.set(id, {
          id: Number(member.id),
          label: String(member.label || ""),
          dup: !!member.dup,
          dept: Number(member.dept),
          grade: Number(member.grade),
          klass: Number(member.klass),
          deleted: false,
        });
        original.set(id, Number(member.dept) + "-" + Number(member.grade) + "-" + Number(member.klass));
      });

      const classes = spec.classes || [];
      const teacherByCell = new Map();
      (spec.teachers || []).forEach(function (item) {
        const label = String(item.name || "").trim();
        if (!label) return;
        teacherByCell.set(item.dept + "-" + item.grade + "-" + item.klass, label);
      });
      const board = document.createElement("div");
      board.className = "board";
      board.style.setProperty("--cols", String(Math.max(classes.length, 1)));

      function addHead(text, column, className) {
        const head = document.createElement("div");
        head.className = "head" + (className ? " " + className : "");
        head.textContent = text;
        place(head, column, 1);
        board.appendChild(head);
      }
      addHead("부", 1, "");
      addHead("학년", 2, "");
      classes.forEach(function (klass, index) {
        addHead(klass + "반", 3 + index, "");
      });

      let row = 2;
      (spec.depts || []).forEach(function (block, blockIndex) {
        if (blockIndex > 0) {
          const gap = document.createElement("div");
          gap.className = "block-gap";
          gap.style.gridColumn = "1 / -1";
          gap.style.gridRow = String(row);
          board.appendChild(gap);
          row += 1;
        }
        const grades = block.grades || [];
        const dept = document.createElement("div");
        dept.className = "dept";
        dept.textContent = String(block.dept);
        place(dept, 1, row, Math.max(grades.length, 1));
        board.appendChild(dept);
        grades.forEach(function (grade) {
          const gradeCell = document.createElement("div");
          gradeCell.className = "grade";
          gradeCell.textContent = String(grade);
          place(gradeCell, 2, row);
          board.appendChild(gradeCell);
          classes.forEach(function (klass, index) {
            const cell = document.createElement("div");
            cell.className = "cell";
            cell.dataset.dept = String(block.dept);
            cell.dataset.grade = String(grade);
            cell.dataset.klass = String(klass);
            const teacherName = teacherByCell.get(block.dept + "-" + grade + "-" + klass) || "";
            if (!teacherName) cell.classList.add("no-teacher");
            place(cell, 3 + index, row);
            if (teacherName) {
              const teacher = document.createElement("div");
              teacher.className = "teacher";
              teacher.textContent = teacherName;
              cell.appendChild(teacher);
            }
            const names = document.createElement("div");
            names.className = "names";
            cell.appendChild(names);
            cell.addEventListener("pointerdown", function (event) {
              if (event.target.closest(".chip")) return;
              selectCell(cell);
              hidePop();
            });
            board.appendChild(cell);
          });
          row += 1;
        });
      });

      scroller.replaceChildren(board);
      renderChips();
      updateStatus();
    }

    function onChipPointerDown(event) {
      if (event.button !== 0) return;
      const chip = event.currentTarget;
      const cell = chip.closest(".cell");
      hidePop();
      selectCell(cell);
      const originX = event.clientX;
      const originY = event.clientY;
      try { chip.setPointerCapture(event.pointerId); } catch (err) { /* 캡처 미지원 */ }
      const move = function (ev) {
        const dx = ev.clientX - originX;
        const dy = ev.clientY - originY;
        if (!drag && dx * dx + dy * dy < 25) return;
        if (!drag) beginDrag(chip, ev);
        lastX = ev.clientX;
        lastY = ev.clientY;
        moveGhost(ev.clientX, ev.clientY);
        markDrop(ev.clientX, ev.clientY);
      };
      const up = function (ev) {
        chip.removeEventListener("pointermove", move);
        if (drag) finishDrag(ev.clientX, ev.clientY);
      };
      chip.addEventListener("pointermove", move);
      chip.addEventListener("pointerup", up, { once: true });
      chip.addEventListener("pointercancel", up, { once: true });
    }

    function onChipDblClick(event) {
      event.preventDefault();
      event.stopPropagation();
      const chip = event.currentTarget;
      const cell = chip.closest(".cell");
      if (!cell) return;
      selectCell(cell);
      showPop(event.clientX, event.clientY, chip.dataset.id);
    }

    function beginDrag(chip, event) {
      const ghost = document.createElement("div");
      ghost.className = chip.classList.contains("dup") ? "ghost dup" : "ghost";
      ghost.textContent = chip.textContent;
      document.body.appendChild(ghost);
      chip.classList.add("dragging");
      document.body.classList.add("is-dragging");
      drag = { id: chip.dataset.id, chip: chip, ghost: ghost };
      lastX = event.clientX;
      lastY = event.clientY;
      moveGhost(event.clientX, event.clientY);
      scrollRaf = requestAnimationFrame(tickScroll);
    }

    function moveGhost(x, y) {
      if (!drag || !drag.ghost) return;
      drag.ghost.style.transform = "translate3d(" + x + "px, " + y + "px, 0) translate(-50%, -130%)";
    }

    function cellAt(x, y) {
      const el = document.elementFromPoint(x, y);
      return el ? el.closest(".cell") : null;
    }

    function markDrop(x, y) {
      document.querySelectorAll(".cell.drop").forEach(function (el) {
        el.classList.remove("drop");
      });
      const cell = cellAt(x, y);
      if (cell) cell.classList.add("drop");
    }

    function autoScroll(x) {
      const rect = scroller.getBoundingClientRect();
      const edge = 46;
      if (x > rect.right - edge) {
        scroller.scrollLeft += Math.ceil(8 + 16 * ((x - (rect.right - edge)) / edge));
      } else if (x < rect.left + edge) {
        scroller.scrollLeft -= Math.ceil(8 + 16 * ((rect.left + edge - x) / edge));
      }
    }

    function tickScroll() {
      if (!drag) return;
      autoScroll(lastX);
      markDrop(lastX, lastY);
      scrollRaf = requestAnimationFrame(tickScroll);
    }

    function cleanupDrag() {
      if (scrollRaf) cancelAnimationFrame(scrollRaf);
      scrollRaf = 0;
      if (drag && drag.ghost) drag.ghost.remove();
      if (drag && drag.chip) drag.chip.classList.remove("dragging");
      document.querySelectorAll(".cell.drop").forEach(function (el) {
        el.classList.remove("drop");
      });
      document.body.classList.remove("is-dragging");
      drag = null;
    }

    function finishDrag(x, y) {
      const id = drag ? drag.id : "";
      const cell = cellAt(x, y);
      cleanupDrag();
      if (!cell || !id) return;
      const item = state.get(id);
      if (!item || item.deleted) return;
      const dept = Number(cell.dataset.dept);
      const grade = Number(cell.dataset.grade);
      const klass = Number(cell.dataset.klass);
      if (item.dept === dept && item.grade === grade && item.klass === klass) return;
      item.dept = dept;
      item.grade = grade;
      item.klass = klass;
      renderChips();
      selectCell(document.querySelector(
        '.cell[data-dept="' + dept + '"][data-grade="' + grade + '"][data-klass="' + klass + '"]'
      ));
      updateStatus();
    }

    function newNonce() {
      return (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : String(Date.now()) + "-" + Math.random().toString(16).slice(2);
    }

    function onReset() {
      hidePop();
      cleanupDrag();
      resetBtn.disabled = true;
      saveBtn.disabled = true;
      statusEl.textContent = "초기화하는 중...";
      post("streamlit:setComponentValue", {
        dataType: "json",
        value: {
          action: "reset",
          nonce: newNonce(),
          year: specYear,
        },
      });
    }

    function onSave() {
      const diff = changeSets();
      if (!diff.moves.length && !diff.deletes.length) {
        statusEl.textContent = "변경된 내용이 없습니다.";
        return;
      }
      saveBtn.disabled = true;
      statusEl.textContent = "저장하는 중...";
      window.clearTimeout(saveTimer);
      saveTimer = window.setTimeout(function () {
        resetBtn.disabled = false;
        saveBtn.disabled = false;
        if (statusEl.textContent === "저장하는 중...") {
          statusEl.textContent = "저장 응답이 없습니다. 다시 저장해 주세요.";
        }
      }, 12000);
      post("streamlit:setComponentValue", {
        dataType: "json",
        value: {
          action: "save",
          nonce: newNonce(),
          year: specYear,
          moves: diff.moves,
          deletes: diff.deletes,
        },
      });
    }

    function onRender(args) {
      const spec = args.spec || {};
      const sig = String(spec.sig || "");
      if (sig && sig !== builtSig) {
        builtSig = sig;
        mount(spec);
      }
      const errorNonce = String(spec.error_nonce || "");
      if (errorNonce && errorNonce !== seenError) {
        seenError = errorNonce;
        window.clearTimeout(saveTimer);
        resetBtn.disabled = false;
        saveBtn.disabled = false;
        statusEl.textContent = "저장하지 못했습니다. 다시 저장해 주세요.";
      }
      requestAnimationFrame(fit);
    }

    resetBtn.addEventListener("click", onReset);
    saveBtn.addEventListener("click", onSave);
    delpop.addEventListener("click", function (event) {
      event.stopPropagation();
      const item = state.get(delpop.dataset.id || "");
      if (item) item.deleted = true;
      hidePop();
      renderChips();
      updateStatus();
    });
    document.addEventListener("pointerdown", function (event) {
      if (delpop.hidden) return;
      if (event.target === delpop) return;
      hidePop();
    }, true);
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        hidePop();
        cleanupDrag();
      }
    });
    window.addEventListener("resize", fit);
    if (window.ResizeObserver) {
      const observer = new ResizeObserver(function () { fit(); });
      observer.observe(document.body);
    }

    window.addEventListener("message", function (event) {
      if (event.source !== window.parent) return;
      const data = event.data;
      if (!data || data.type !== "streamlit:render") return;
      onRender(data.args || {});
    });
    post("streamlit:componentReady", { apiVersion: 1 });
    requestAnimationFrame(fit);
  </script>
</body>
</html>
